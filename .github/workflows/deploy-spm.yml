name: Deploy SPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without prefix (example: 1.0.0)"
        required: true
        type: string
      release_notes:
        description: "Optional release notes"
        required: false
        type: string

concurrency:
  group: deploy-spm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy Swift Package
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use semantic versioning like 1.0.0" >&2
            exit 1
          fi

      - name: Ensure tag does not already exist
        shell: bash
        run: |
          set -euo pipefail

          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists locally: $VERSION" >&2
            exit 1
          fi

          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "Tag already exists on origin: $VERSION" >&2
            exit 1
          fi

      - name: Swift Version
        run: swift --version

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          set +e
          swift test 2>&1 | tee deploy-test.log
          testStatus=${PIPESTATUS[0]}
          set -e
          exit $testStatus

      - name: Upload deploy test log artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deploy-spm-test-log
          path: deploy-test.log
          if-no-files-found: ignore

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          VERSION: ${{ env.VERSION }}
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}
        with:
          script: |
            const version = process.env.VERSION;
            const releaseNotes = process.env.RELEASE_NOTES?.trim();
            const body = releaseNotes && 0 < releaseNotes.length
              ? releaseNotes
              : [
                  `StoredPropertyInit Swift Package release ${version}`,
                  '',
                  `- Ref: ${context.ref}`,
                  `- Commit: ${context.sha}`,
                ].join('\n');

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: version,
              body,
              generate_release_notes: !releaseNotes,
            });
