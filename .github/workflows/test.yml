name: Test

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      pr_actor:
        required: true
        type: string
      pr_head_ref:
        required: true
        type: string
      pr_head_sha:
        required: true
        type: string

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    name: Swift Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.pr_head_sha }}

      - name: Swift Version
        run: swift --version

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          set +e
          swift test 2>&1 | tee test.log
          testStatus=${PIPESTATUS[0]}
          set -e
          exit $testStatus

      - name: Upload test log artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: test.log
          if-no-files-found: ignore

  notify_pr_failure:
    name: Notify PR Failure (Test)
    needs: test
    if: ${{ always() && needs.test.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download test log artifact
        uses: actions/download-artifact@v7
        with:
          name: test-log
          path: artifacts
        continue-on-error: true

      - name: Comment on Failed PR
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let body = [
              `@${{ inputs.pr_actor }} swift-stored-property-init test CI가 실패했습니다.`,
              '',
              `- Workflow: ${context.workflow}`,
              `- Branch: ${{ inputs.pr_head_ref }}`,
              `- Commit: ${{ inputs.pr_head_sha }}`,
              `- Run: ${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            ].join('\n');

            const logPath = 'artifacts/test.log';
            if (fs.existsSync(logPath)) {
              const log = fs.readFileSync(logPath, 'utf8');
              const lines = log.split(/\r?\n/);
              const errorLines = lines.filter((line) =>
                /error:/i.test(line) || /fatal error:/i.test(line) || /failed/i.test(line)
              );
              const trimmedLines = errorLines.slice(0, 30);
              if (0 < trimmedLines.length) {
                body += '\n\n### 오류 요약\n```\n' + trimmedLines.join('\n') + '\n```';
              } else {
                body += '\n\n### 오류 요약\n로그에서 에러 라인을 찾지 못했습니다.';
              }
            } else {
              body += '\n\n### 오류 요약\ntest.log를 찾지 못했습니다.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body,
            });
